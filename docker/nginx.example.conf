# Ejemplo de sitio Nginx en el VPS (proxy inverso hacia el contenedor).
# El certificado HTTPS se gestiona en el servidor web (p. ej. con certbot).
server {
    listen 443 ssl http2;
    server_name pos.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/pos.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.tudominio.com/privkey.pem;

    # Tamaño máximo de subida (fotos de productos y logos)
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (pantalla de cocina en tiempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name pos.tudominio.com;
    return 301 https://$host$request_uri;
}

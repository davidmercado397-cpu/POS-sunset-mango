# Ejemplo de configuración Nginx en el VPS (proxy inverso hacia el contenedor).
# Los certificados HTTPS se gestionan en el servidor web (por ejemplo con certbot).
#
# Dominios de ejemplo:
#   pos.tudominio.com            -> aplicación del punto de venta (personal del negocio)
#   *.pedidos.tudominio.com      -> tiendas en línea, un subdominio por negocio (PUBLIC_STORE_DOMAIN=pedidos.tudominio.com)
#   pedidos.minegocio.com        -> (opcional) dominio propio de un negocio, asignado por el Super Admin
#
# Todos apuntan al mismo contenedor: la aplicación reconoce el host y muestra la tienda correcta.

# Configuración común del proxy
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1) Aplicación del punto de venta
server {
    listen 443 ssl http2;
    server_name pos.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/pos.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.tudominio.com/privkey.pem;

    # Tamaño máximo de subida (fotos de productos, logos y soportes)
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (pantalla de cocina y avisos en tiempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# 2) Tiendas en línea por subdominio (comodín).
#    DNS: registro A (o CNAME) para "*.pedidos.tudominio.com" apuntando a la IP del VPS.
#    Certificado comodín: requiere validación por DNS, por ejemplo:
#      certbot certonly --manual --preferred-challenges dns -d "*.pedidos.tudominio.com"
#    (o el plugin de DNS de tu proveedor para renovarlo automáticamente).
server {
    listen 443 ssl http2;
    server_name *.pedidos.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/pedidos.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pedidos.tudominio.com/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3) (Opcional) Dominio propio de un negocio: un bloque por dominio con su certificado.
